<!doctype html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ننوتل</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 80px; }
    form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); width: 280px; }
    h1 { font-size: 18px; margin: 0 0 14px; }
    input, button { width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    input { direction: ltr; }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
    #err { color: #b91c1c; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <form id="form">
    <h1>ډشبورډ ته ننوتل</h1>
    <input id="password" type="password" placeholder="پاسورډ" autocomplete="current-password" required>
    <button type="submit">ننوتل</button>
    <div id="err"></div>
  </form>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (res.ok) {
          location.href = '/';
        } else if (res.status === 429) {
          err.textContent = 'ډېرې هڅې شوې، وروسته هڅه وکړئ';
        } else {
          err.textContent = 'پاسورډ سم نه دی';
        }
      } catch (e2) {
        err.textContent = 'له سرور سره اړیکه نشته';
      }
    });
  </script>
</body>
</html>
